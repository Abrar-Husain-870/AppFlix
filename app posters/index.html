<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix 3D Poster Wall Replicated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Dark Background Stage -->
  <div class="netflix-stage">
    
    <!-- Top Control / Header Navigation -->
    <header class="top-nav">
      <div class="brand">
        <span class="logo-text">NETFLIX</span>
        <span class="badge">CODE REPLICA</span>
      </div>
      <div class="stats-bar">
        <span class="stat-item"><strong id="total-count">46</strong> Posters Total</span>
        <span class="stat-divider">•</span>
        <span class="stat-item"><strong>23</strong> Landscape</span>
        <span class="stat-divider">•</span>
        <span class="stat-item"><strong>23</strong> Portrait</span>
      </div>
      <div class="controls-group">
        <button id="toggle-perspective-btn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          Toggle 3D / Flat View
        </button>
        <button id="reset-tilt-btn" class="btn btn-icon" title="Reset View">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </header>

    <!-- 3D Perspective Wall Wrapper -->
    <div class="perspective-viewport" id="viewport">
      <div class="wall-grid" id="wall-grid">
        <!-- Rows populated dynamically via JS -->
      </div>
    </div>

    <!-- Vignette & Gradient Overlays -->
    <div class="overlay vignette-overlay"></div>
    <div class="overlay top-gradient"></div>
    <div class="overlay bottom-gradient"></div>

    <!-- Floating Interactive Controller -->
    <div class="floating-controls">
      <div class="control-row">
        <label for="rotate-x">Tilt X</label>
        <input type="range" id="rotate-x" min="0" max="45" value="22">
        <span id="val-x">22°</span>
      </div>
      <div class="control-row">
        <label for="rotate-y">Rotate Y</label>
        <input type="range" id="rotate-y" min="-30" max="30" value="-10">
        <span id="val-y">-10°</span>
      </div>
      <div class="control-row">
        <label for="rotate-z">Angle Z</label>
        <input type="range" id="rotate-z" min="-20" max="20" value="8">
        <span id="val-z">8°</span>
      </div>
      <div class="control-row">
        <label for="scale-wall">Zoom</label>
        <input type="range" id="scale-wall" min="80" max="150" value="115">
        <span id="val-scale">1.15x</span>
      </div>
      <button id="copy-transform-btn" class="btn btn-secondary" style="margin-top: 8px; width: 100%; justify-content: center;">
        Copy CSS Transform
      </button>
    </div>


  </div>

  <script src="app.js"></script>
</body>
</html>
